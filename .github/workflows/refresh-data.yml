name: Refresh official real-estate data

# 2026-10-08: R-ONE 주간 매매·전세 최근 52주 시계열을 최초 역수집합니다.

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-data.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: refresh-official-real-estate-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://yeongnam-property-atlas.jjk08255.chatgpt.site
    steps:
      - name: Check out collector source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install weekly workbook reader
        run: python -m pip install "openpyxl~=3.1"

      - name: Import R-ONE weekly history
        # Import and retain the 52 official weekly points displayed by the graph.
        run: python scripts/import-rone-weekly.py

      - name: Collect Incheon, KOSIS and ApplyHome
        shell: bash
        run: |
          set -euo pipefail

          oidc_token() {
            curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=yeongnam-property-atlas" \
              | jq -er '.value'
          }

          collect() {
            local path="$1"
            local body="$2"
            local token
            token="$(oidc_token)"
            curl --fail-with-body --silent --show-error --retry 2 \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              --data "${body}" \
              "${SITE_URL}${path}"
            echo
          }

          today="$(date -u +%F)"
          year="$(date -u +%Y)"
          start_year="$((year - 5))"
          collect "/api/incheon" '{}'
          collect "/api/kosis" "$(jq -nc --argjson start "${start_year}" --argjson end "${year}" '{startYear:$start,endYear:$end}')"
          collect "/api/rone" "$(jq -nc --arg event "${GITHUB_EVENT_NAME}" '{backfill:($event=="push")}')"

          collect_range() {
            local cursor="$1"
            local end="$2"
            local supply_only="${3:-false}"
            while [[ "${cursor}" < "${end}" || "${cursor}" == "${end}" ]]; do
              local chunk_end
              chunk_end="$(date -u -d "${cursor} + 13 days" +%F)"
              if [[ "${chunk_end}" > "${end}" ]]; then chunk_end="${end}"; fi
              collect "/api/sync" "$(jq -nc --arg from "${cursor}" --arg to "${chunk_end}" --argjson supplyOnly "${supply_only}" '{from:$from,to:$to,supplyOnly:$supplyOnly}')"
              cursor="$(date -u -d "${chunk_end} + 1 day" +%F)"
            done
          }

          # Refresh schema v3 also stores official move-in plans as expected supply.
          # Refresh the full current application schedule fields, including
          # special supply and first/second-priority application dates. Closed
          # notices also fetch the separate official competition/status API.
          collect_range "$(date -u -d "${today} + 1 day" +%F)" "$(date -u -d "${today} + 180 days" +%F)"
          collect_range "$(date -u -d "${today} - 90 days" +%F)" "${today}"

          # A workflow-file push runs a one-time historical backfill. Only annual
          # supply evidence is stored, so past notices do not crowd the calendar.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            collect_range "2020-01-01" "${today}" true
          fi
